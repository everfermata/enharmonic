<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>澪標</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Gothic+A1:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --w-face:#c0c0c0; --w-hi:#ffffff; --w-lt:#dfdfdf; --w-sh:#808080; --w-dk:#0a0a0a;
  --desk:#1b1b1d; --ink:#141416; --red:#c8102e; --red-d:#e3324d;
  --kr:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --logo:"Zen Kaku Gothic New","Nanum Gothic",sans-serif;   /* 제목·메뉴 (SET.font.title 로 바뀜) */
  --txt:"Gothic A1","Nanum Gothic",sans-serif;              /* 대사·이름·선택지 (SET.font.text) */
  --flood:"Nanum Myeongjo",serif;                           /* [반복] 글 (SET.font.flood) */
  --out:inset -1px -1px var(--w-dk),inset 1px 1px var(--w-hi),inset -2px -2px var(--w-sh),inset 2px 2px var(--w-lt);
  --in:inset 1px 1px var(--w-dk),inset -1px -1px var(--w-hi),inset 2px 2px var(--w-sh),inset -2px -2px var(--w-lt);
  --sunk:inset 1px 1px var(--w-sh),inset -1px -1px var(--w-hi),inset 2px 2px var(--w-dk),inset -2px -2px var(--w-lt);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk)}
body{font-family:var(--kr);font-size:12px;color:#000;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ── 바탕화면 ── */
.desk{position:relative;overflow:hidden;min-height:360px;background-color:var(--desk);
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px);background-size:3px 3px;user-select:none;-webkit-user-select:none}
.icons{position:absolute;left:8px;top:10px;display:grid;gap:16px}
.ic{width:76px;padding:2px;text-align:center;color:#fff;cursor:default;background:none;border:0}
.ic svg{display:block;width:32px;height:32px;margin:0 auto 4px}
.ic span{display:inline-block;padding:1px 3px;line-height:1.3}
.ic.sel span{background:#000;outline:1px dotted #fff}
.ic.sel svg{filter:brightness(.7)}
.desk.narrow .icons{display:none}

/* ── 작업 표시줄 ── */
.tb{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:900;display:flex;align-items:center;gap:4px;padding:3px 2px 1px;
  background:var(--w-face);box-shadow:inset 0 1px var(--w-lt),inset 0 2px var(--w-hi)}
.btn98{background:var(--w-face);border:0;border-radius:0;box-shadow:var(--out);padding:3px 10px;min-height:23px;cursor:default}
.btn98:active:not(:disabled),.btn98.on{box-shadow:var(--in)}
.btn98:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn98:disabled{color:var(--w-sh);text-shadow:1px 1px var(--w-hi)}
.btn98.on{background-color:#d6d6d6;background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);
  background-size:2px 2px;background-position:0 0,1px 1px}
.start{display:flex;align-items:center;gap:5px;font-weight:800;padding:2px 8px 2px 4px;height:24px}
.slogo{display:inline-grid;place-items:center;width:16px;height:16px;background:#000;color:#fff;font-size:12px;line-height:1}
.sep{width:2px;height:22px;box-shadow:inset 1px 0 var(--w-sh),inset -1px 0 var(--w-hi);margin:0 2px}
.task{display:flex;align-items:center;gap:5px;width:190px;max-width:38vw;height:24px;padding:2px 6px;text-align:left;overflow:hidden}
.task span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task.on{font-weight:800}
.task svg,.sm svg{width:16px;height:16px;flex:none}
.tray{margin-left:auto;display:flex;align-items:center;gap:8px;height:24px;padding:0 10px 0 6px;box-shadow:inset 1px 1px var(--w-sh),inset -1px -1px var(--w-hi)}
.spk{display:grid;place-items:center;width:18px;height:18px;padding:0;background:none;border:0;cursor:default}
.spk svg{width:14px;height:14px}
.spk .mx{display:none}
.spk.muted .mx{display:inline}
.spk.muted .wv{display:none}

/* 시작 메뉴 */
.sm{position:absolute;left:2px;bottom:28px;z-index:950;display:flex;background:var(--w-face);box-shadow:var(--out);padding:3px}
.sm .band{width:24px;background:linear-gradient(0deg,#000,#7a7a7a);color:#d6d6d6;writing-mode:vertical-rl;transform:rotate(180deg);
  font-weight:800;font-size:15px;letter-spacing:.12em;padding:8px 2px;text-align:right}
.sm .band b{color:#fff}
.sm ul{list-style:none;margin:0;padding:0;min-width:200px}
.sm li button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px 7px 8px;background:none;border:0;text-align:left;cursor:default}
.sm li button:hover,.sm li button:focus-visible{background:#000;color:#fff;outline:0}
.sm li button:hover svg,.sm li button:focus-visible svg{filter:invert(1)}
.sm hr{border:0;height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--w-sh),inset 0 -1px var(--w-hi)}

/* ── 창 ── */
.win{position:absolute;background:var(--w-face);padding:3px;box-shadow:var(--out);z-index:10}
.tt{display:flex;align-items:center;gap:4px;height:20px;padding:0 2px 0 4px;background:linear-gradient(90deg,#000,#8c8c8c);color:#fff;font-weight:800;touch-action:none;cursor:default}
.win.inact .tt{background:linear-gradient(90deg,#7b7b7b,#b8b8b8);color:#dedede}
.tt .ti{width:16px;height:16px;flex:none}
.tt .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbtn{width:16px;height:14px;padding:0;display:grid;place-items:center;background:var(--w-face);border:0;box-shadow:var(--out);cursor:default;flex:none}
.tbtn:active:not(:disabled){box-shadow:var(--in)}
.tbtn svg{fill:#000}
.tbtn:disabled svg{fill:var(--w-sh)}
.tbtn.x{margin-left:2px}
.client{position:relative;margin-top:2px;padding:2px;box-shadow:var(--sunk);background:#000;container-type:inline-size}
.win.hang .client::after{content:"";position:absolute;inset:2px;background:rgba(255,255,255,.42);z-index:60;pointer-events:none}
.nbody{margin-top:2px;height:250px;overflow:auto;padding:6px 8px;background:#fff;box-shadow:var(--sunk);font-size:13px;line-height:1.7;white-space:pre-wrap;user-select:text;-webkit-user-select:text}

/* 확인 창 */
.blk{position:absolute;inset:0;z-index:990}
.dlg{z-index:1000;width:310px;max-width:calc(100% - 16px)}
.dbody{display:flex;align-items:center;gap:14px;padding:18px 14px 12px}
.dbody p{margin:0;font-size:13px;line-height:1.55;white-space:pre-line}
.dic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #000;font-style:normal;font-weight:800;font-size:18px}
.drow{display:flex;justify-content:center;gap:8px;padding:2px 0 10px}
.drow .btn98{min-width:76px}
.off{position:absolute;inset:0;z-index:2000;background:#000;color:#cfcfcf;display:grid;place-items:center;text-align:center;font-size:16px;line-height:2;cursor:default}
.off small{display:block;font-size:12px;color:#777}

/* ══════ 게임 화면 (4:3 — 그 시절 800×600 비율) ══════ */
.game{position:relative;aspect-ratio:4/3;overflow:hidden;background:#fff;color:var(--ink);cursor:default;outline:0;
  font-family:var(--kr);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.layer{position:absolute;inset:0}
/* 임시 그림: 회색 판 + 이름표만 */
.ph{position:absolute;inset:0;display:grid;place-items:center;background:#e4e5e8;color:#9a9da3;font-size:12px;letter-spacing:.1em}
.bg{transition:filter 1.2s}
.bg img,.tcg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 그림 위치(POS) — x·y = 보이는 부분, zoom = 크기 */
.bg img,.tcg img,.cg img{object-position:var(--px,50%) var(--py,50%);transform:scale(var(--pz,1));transform-origin:var(--px,50%) var(--py,50%)}
/* 그림이 바뀔 때 서서히 겹침 */
.bg img,.tcg img,.cg img,.st img{opacity:0;transition:opacity var(--fd,600ms) ease}
.bg img.on,.tcg img.on,.cg img.on,.st img.on{opacity:1}
.st{position:absolute;bottom:0;width:32%;height:84%;opacity:0;transform:translateY(1.6%);transform-origin:var(--zo,50% 30%);
  transition:opacity var(--sf,450ms) ease,transform var(--sf,450ms) ease,filter .3s}
#stL{left:12%} #stR{right:12%}
.st .ph{background:rgba(196,199,204,.55);border-radius:2px;align-items:start;padding-top:28%}
.st img{position:absolute;bottom:0;left:50%;height:100%;width:auto;max-width:none;transform:translate(calc(-50% + var(--sx,0%)),var(--sy,0%)) scale(var(--pz,1));transform-origin:50% 100%}
.game[data-mode=play] .st.show{opacity:1;transform:none}
/* [확대] 얼굴 쪽으로 다가옴 */
.game[data-mode=play] .st.show.zoom{transform:translateY(var(--zy,-5%)) scale(var(--zs,2.2));transition:opacity var(--sf,450ms) ease,transform var(--zt,900ms) cubic-bezier(.2,.75,.2,1),filter .3s}
.st.dim{filter:brightness(.82)}
.game.cold .bg{filter:brightness(.84) contrast(1.06) saturate(.6)}
.game.cold .st{filter:brightness(.76) saturate(.6)}

/* 날짜 표시 (왼쪽 위) */
.cal{position:absolute;left:2.6%;top:3%;z-index:2;display:none;padding:.35em .9em;background:rgba(255,255,255,.8);border:1px solid #2a2a2d;
  font-weight:700;font-size:clamp(10px,1.5cqw,14px);letter-spacing:.1em;color:#1b1b1d}
.game[data-mode=play] .cal{display:block}
.game.dark .cal,.game.red .cal{color:var(--red);border-color:var(--red)}

/* 대사창 — 화면 아래를 가로로 덮는 흰 그라데이션 띠 */
.msg{position:absolute;left:0;right:0;bottom:0;height:33%;z-index:3;display:none;padding:3.6cqw 9% 6cqw;font-family:var(--txt);
  background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.74) 24%,rgba(255,255,255,.9) 62%,rgba(255,255,255,.94))}
.game[data-mode=play] .msg{display:block}
.who{display:flex;align-items:center;gap:.7em;height:1.4em;margin-bottom:.3em;font-weight:800;font-size:clamp(11px,1.75cqw,16px);letter-spacing:.14em;color:#1b1b1d;
  text-shadow:0 0 3px #fff,0 0 6px #fff}
.who::after{content:"";width:3.2em;height:1px;background:currentColor;opacity:.55}
.who.off{visibility:hidden}
.who.blank::after{width:6em}   /* 이름판 비움: 글자 없이 선만 남음 */
.txt{font-weight:700;font-size:clamp(14px,2.45cqw,23px);line-height:1.78;letter-spacing:.02em;color:var(--ink);
  text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 7px rgba(255,255,255,.95);word-break:keep-all}
.txt .r{color:var(--red)}
.wt{display:inline-block;width:0;height:0;margin-left:.35em;vertical-align:.06em;border-left:.32em solid transparent;border-right:.32em solid transparent;border-top:.46em solid var(--ink);
  animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
.game.hidew .msg,.game.hidew .qm,.game.hidew .cal{visibility:hidden}

/* 이벤트 그림(CG) — 화면 전체 */
.cg{position:absolute;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity var(--cf,600ms) ease,visibility 0s linear var(--cf,600ms)}
.cg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.game.cgon .cg{opacity:1;visibility:visible;transition:opacity var(--cf,600ms) ease}
.game.cgon .st{opacity:0!important;transition:opacity var(--cf,600ms) ease}
.st.solo{left:34%!important;right:auto!important}

.scar{position:absolute;inset:0;background:#fff}
.scar svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scar .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:scardraw var(--sd,1600ms) .3s cubic-bezier(.55,0,.25,1) forwards}
@keyframes scardraw{to{stroke-dashoffset:0}}

/* ── 고장 효과 ── */
/* 어둠: 대사창 띠가 검게 바뀜 */
.game.dark .msg{background:linear-gradient(rgba(6,6,8,0),rgba(6,6,8,.8) 24%,rgba(6,6,8,.93) 62%,rgba(6,6,8,.97))}
.game.dark .txt{color:#f2f2f4;text-shadow:0 0 3px #000,0 0 7px #000}
.game.dark .who{color:#f2f2f4;text-shadow:0 0 4px #000}
.game.dark .who::after{background:var(--red);opacity:1;height:2px;width:5em}
.game.dark .wt{border-top-color:#f2f2f4}
.game.dark .txt .r{color:var(--red-d)}
.game.dark .qm button{background:rgba(18,18,20,.55);color:#e7e7ea;border-color:#66666b;box-shadow:none}
/* 붉음: 장면 전체가 핏빛으로 물들고 서 있는 그림은 검은 그림자가 됨 */
.tint{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 3.2s ease;mix-blend-mode:multiply;
  background:radial-gradient(ellipse 70% 62% at 50% 42%,rgba(255,255,255,0),rgba(40,0,6,.62)),#a3001b}
.game.red .tint{opacity:.9}
.game.red .st{filter:brightness(0)!important;transition:filter 2.6s ease,opacity .5s,transform var(--zt,900ms) cubic-bezier(.2,.75,.2,1)}
.game.red .st .ph{color:transparent}
/* 반복: 같은 말이 화면을 가득 메움 */
.flood{position:absolute;inset:0;z-index:8;display:none;padding:3cqw 4cqw;overflow:hidden;background:rgba(5,5,7,.5);
  font-family:var(--flood);font-weight:400;font-size:clamp(14px,2.45cqw,22px);line-height:1.5;letter-spacing:.03em;color:#f4f4f6;word-break:keep-all}
.flood.on{display:block}
.flood span{display:inline-block;margin-right:.55em;white-space:nowrap}
.flood span.r{color:var(--red-d)}

/* 시스템 버튼 — 둥근 알약 줄 */
.qm{position:absolute;left:0;right:0;bottom:1.6%;z-index:4;display:none;justify-content:center;gap:.7cqw}
.game[data-mode=play] .qm{display:flex}
.qm button{display:inline-flex;align-items:center;gap:.4em;height:max(20px,2.9cqw);padding:0 .95em;border-radius:999px;border:1px solid #2b2b2e;
  background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.18);
  font-family:var(--kr);font-weight:800;font-size:clamp(9px,1.2cqw,12px);letter-spacing:.02em;color:#1f1f22;cursor:pointer;white-space:nowrap}
.qm button:hover:not(:disabled){background:#fff}
.qm button.on{background:#1b1b1d;color:#fff;border-color:#1b1b1d}
.qm button:disabled{opacity:.3;cursor:default}


/* 선택지 */
.choice{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:center;align-items:center;gap:2.2cqw;padding-bottom:8%;background:rgba(255,255,255,.28)}
.choice.on{display:flex}
.choice button{position:relative;width:60%;padding:1.3cqw 0;font-family:var(--txt);font-weight:700;font-size:clamp(13px,2.1cqw,19px);letter-spacing:.06em;
  background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.95) 18%,rgba(255,255,255,.95) 82%,rgba(255,255,255,.35));border:0;border-top:1px solid #2a2a2d;border-bottom:1px solid #2a2a2d;color:#141416;cursor:pointer}
.choice button:hover,.choice button:focus-visible{background:#1b1b1d;color:#fff;outline:0}
.choice button.ow::after{content:"";display:inline-block;width:.08em;height:1.05em;margin-left:.12em;vertical-align:-.15em;background:var(--red)}  /* 덮어쓰는 중 커서 */
.game.dark .choice{background:rgba(6,6,8,.42)}
.game.dark .choice button{background:linear-gradient(90deg,rgba(14,14,16,.3),rgba(14,14,16,.94) 18%,rgba(14,14,16,.94) 82%,rgba(14,14,16,.3));border-color:#5a5a60;color:#ececef}
.game.dark .choice button:hover,.game.dark .choice button:focus-visible{background:#ececef;color:#0e0e10}

/* 아이캐치 (장면 사이) */
.eye{position:absolute;inset:0;z-index:15;display:none;place-items:center;background:#fff;text-align:center}
.eye.on{display:grid}
.eye .lg{font-family:var(--logo);font-weight:700;font-size:clamp(22px,5cqw,48px);letter-spacing:.08em;line-height:1}
.eye .sb{margin-top:.8em;font-family:var(--logo);font-weight:500;font-size:clamp(10px,1.35cqw,13px);letter-spacing:.24em;color:#55575c}
.eye .dt{position:relative;display:inline-block;margin-top:2.4em;font-weight:700;font-size:clamp(12px,1.8cqw,17px);letter-spacing:.2em}
.eye.loop .dt::after{content:attr(data-v);position:absolute;inset:0;color:var(--red);opacity:.38;transform:translate(3px,2px)}

/* 마름모 와이프 전환 (그 시절 「룰 화상」 전환) */
.wipe{position:absolute;inset:0;z-index:30;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(9,1fr);pointer-events:none;overflow:hidden}
.wipe i{position:relative}
.wipe i::before{content:"";position:absolute;left:50%;top:50%;width:210%;height:210%;background:var(--wc,#fff);
  transform:translate(-50%,-50%) rotate(45deg) scale(0);transition:transform .3s ease-in-out;transition-delay:var(--d)}
.wipe.cover i::before{transform:translate(-50%,-50%) rotate(45deg) scale(1)}

/* 타이틀 */
.title{position:absolute;inset:0;z-index:6;display:none;background:#fff}
.game[data-mode=title] .title{display:block}
.tcg{position:absolute;right:0;top:0;bottom:0;width:62%}
.tcg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0) 40%);pointer-events:none}
.staff{position:absolute;left:0;right:38%;top:21%;height:calc(6cqw + 1px);background:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 1.5cqw);opacity:.13}
.logo{position:absolute;left:7%;top:17%}
.logo h1{margin:0;font-family:var(--logo);font-weight:700;font-size:clamp(34px,10cqw,96px);letter-spacing:.06em;line-height:1}
.logo p{margin:.9em 0 0 .2em;font-family:var(--logo);font-weight:500;font-size:clamp(10px,1.7cqw,16px);letter-spacing:.16em;color:#3c3e43}
.tmenu{position:absolute;left:8%;bottom:15%;display:grid;gap:1.1cqw;justify-items:start}
.tmenu button{position:relative;background:none;border:0;padding:.18em 0 .18em 1.4em;font-family:var(--logo);font-weight:500;font-size:clamp(13px,2.1cqw,19px);letter-spacing:.24em;color:#111;cursor:pointer;text-align:left}
.tmenu button::before{content:"♪";position:absolute;left:0;opacity:0;transition:opacity .15s}
.tmenu button:hover:not(:disabled)::before,.tmenu button:focus-visible::before{opacity:1}
.tmenu button:focus-visible{outline:0}
.tmenu button:disabled{color:#c2c4c9;cursor:default}
.ver{position:absolute;left:8%;bottom:4.5%;font-size:clamp(10px,1.2cqw,11px);letter-spacing:.1em;color:#8a8d93}

/* 반전 뒤: 화면 가득 글 */
.nvl{position:absolute;inset:0;z-index:7;display:none;padding:8cqw 10cqw;background:rgba(7,7,9,.9);color:#f1f1f3;font-family:var(--txt);
  font-weight:700;font-size:clamp(13px,2.3cqw,21px);line-height:2.15;letter-spacing:.04em;word-break:keep-all}
.game[data-mode=nvl] .nvl,.game[data-mode=end] .nvl{display:block}
.game[data-mode=nvl] .bg,.game[data-mode=end] .bg{filter:brightness(.35) saturate(.4)}
.nvl p{margin:0;opacity:0;transition:opacity .7s}
.nvl p.in{opacity:1}
.nvl .r{color:var(--red-d)}
.fin{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,3.8cqw,36px);letter-spacing:.32em;opacity:0;transition:opacity 1.8s}
.fin.in{opacity:1}

/* 기록·저장·설정 */
.ov{position:absolute;inset:0;z-index:9;display:none;padding:4cqw 6cqw;background:rgba(255,255,255,.97);overflow:auto;font-size:clamp(13px,1.9cqw,17px)}
.ov.on{display:block}
.ovh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1px solid #111;padding-bottom:1.2cqw;margin-bottom:2.4cqw}
.ovh h2{margin:0;font-family:var(--logo);font-weight:700;font-size:clamp(16px,3cqw,28px);letter-spacing:.2em;line-height:1}
.ovh h2 small{margin-left:.8em;font-family:var(--kr);font-size:.45em;letter-spacing:.1em;color:#55575c}
.back{height:max(22px,3cqw);padding:0 1.2em;border-radius:999px;border:1px solid #2b2b2e;background:#fff;font-family:var(--kr);font-weight:800;font-size:clamp(11px,1.3cqw,13px);cursor:pointer}
.back:hover,.back:focus-visible{background:#1b1b1d;color:#fff;outline:0}
.cfg{display:grid;gap:2.4cqw}
.cfg .row{display:flex;align-items:center;gap:1.4cqw;flex-wrap:wrap}
.cfg .row > span{width:8em;font-weight:700}
.cfg .opt{height:max(22px,3cqw);padding:0 1.1em;border-radius:999px;border:1px solid #2b2b2e;background:#fff;font-family:var(--kr);font-weight:700;cursor:pointer}
.cfg .opt.on{background:#1b1b1d;color:#fff}

@keyframes sh{0%,100%{transform:none}25%{transform:translate(2px,0)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,-1px)}}
.game.shake{animation:sh .36s 1}

/* ── 폰(좁은 창) ── */
@container (max-width:460px){
  .game{aspect-ratio:3/4}
  .st{width:46%;height:62%} #stL{left:2%} #stR{right:2%}
  .msg{height:34%;padding:6cqw 6% 13cqw}
  .who{font-size:12px}
  .txt{font-size:clamp(14px,4.1cqw,17px)}
  .qm{gap:1.6cqw;bottom:2.4%}
  .qm button{font-size:10px;padding:0 .7em;height:22px}
  .cal{font-size:11px}
  .tcg{width:100%}
  .st{--zy:-30%}   /* 폰: 확대할 때 얼굴을 대사창 위로 올림 */
  .bg img,.tcg img,.cg img{object-position:var(--pmx,var(--px,50%)) var(--pmy,var(--py,50%));transform-origin:var(--pmx,var(--px,50%)) var(--pmy,var(--py,50%))}
  .tcg::after{background:linear-gradient(0deg,#fff 22%,rgba(255,255,255,.2) 62%)}
  .staff{right:10%;top:15%;height:calc(12cqw + 1px);background-image:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 3cqw)}
  .logo{top:12%}
  .logo h1{font-size:clamp(40px,19cqw,80px)}
  .logo p{font-size:clamp(10px,3.1cqw,14px);letter-spacing:.08em}
  .tmenu{bottom:12%;gap:2.6cqw}
  .tmenu button{font-size:clamp(14px,4.6cqw,18px)}
  .choice button{width:84%;padding:3cqw 0;font-size:clamp(13px,4.2cqw,17px)}
  .eye .lg{font-size:clamp(28px,11cqw,44px)}
  .eye .sb{font-size:11px;letter-spacing:.08em}
  .eye .dt{font-size:14px}
  .nvl{padding:12cqw 8cqw;font-size:clamp(13px,4.2cqw,17px)}
  .fin{font-size:clamp(18px,6.4cqw,26px)}
  .ov{padding:6cqw 5cqw;font-size:clamp(13px,3.9cqw,16px)}
  .ovh h2{font-size:clamp(16px,5.4cqw,22px)}
  .back{font-size:12px;height:24px}
}

/* ── 시안 확인용 줄(실제 홈에는 넣지 않음) ── */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;background:#2a2a2d;color:#d9d9dc;font-size:13px}
.demo b{margin-right:6px}
.demo button{background:#3a3a3e;border:1px solid #55555a;color:#fff;padding:5px 10px;border-radius:0;cursor:pointer}
.demo button:hover{background:#4a4a4f}
.demo .note{flex-basis:100%;color:#a9a9ae;font-size:12px;min-height:1.2em}
</style>

      <button class="tbtn" type="button" data-act="max" disabled aria-label="최대화"><svg width="9" height="8" viewBox="0 0 9 8"><path fill-rule="evenodd" d="M0 0h9v8H0zM1 2v5h7V2z"/></svg></button>

<script>
/* 澪標 utsuge.html — 수정본6 (2026-11-20) · 그림은 같은 저장소 img 폴더 · GitHub 저장소 enharmonic 맨 위에 이 이름 그대로 올립니다 */
/* ═══════════════════════════════════════════════
   1. 기본 설정 — 제목·이름·소리
   주의: 따옴표 '…' 와 쉼표 , 를 지우면 화면이 멈춥니다.
   ═══════════════════════════════════════════════ */
const SET = {
  gameTitle: '澪標',
  gameSub:   '〜 壊れた共犯の夜が明けるまで 〜',
  windowTitle: '澪標 〜 壊れた共犯の夜が明けるまで 〜 한글패치 1.0',
  names: { 미오:'시라이시 미오', 토와:'시라이시 토와' },  // 대본에 쓰는 짧은 이름 : 화면에 나오는 이름
  sound: {
    on: true,      // 처음에 소리 켜 둘지
    se: true,      // 효과음 (타이틀 버튼 = 불협화음 울림, 게임 안 버튼 = 딸깍)
    seAdv: true,   // 대사를 넘길 때(화면 클릭·Enter)도 딸깍 소리. 끄려면 false
    seVol: 0.6,    // 효과음 크기 0 ~ 1
    bgm1: 'bgm/before.mp3',      // 반전 전 BGM 파일 (예: 'bgm/before.mp3'). 비우면 BGM 없음
    bgm2: 'bgm/after.mp3',      // 반전 뒤 BGM. 비우면 bgm1이 계속 흐름
    bgmVol: 0.7
  },
  speed: 34,          // 글자 나오는 빠르기 (작을수록 빠름)
  slow: { 느림:3, 아주느림:6 },  // [속도 느림] [속도 아주느림] 때 몇 배 느려질지
  slowPause: 380,     // 느린 속도일 때 「… , . ?」 뒤에서 한 번 더 쉬는 시간(ms). 0이면 안 쉼
  slowSkip: true,     // 느린 대사도 클릭하면 바로 다 나오게. false면 끝까지 기다려야 함
  overwrite: { wait:1100, erase:55, type:85 },  // [선택 … 덮어쓰기] 시작까지 기다림·지우는 속도·쓰는 속도(ms)
  fade: { bg:700, stand:450, cg:600 },  // 장면이 바뀔 때 서서히 겹치는 시간(ms) — 배경 · 서 있는 그림 · CG. 0이면 바로 바뀜
  zoom: { scale:1.3, time:900, delay:250, focus:'50% 30%' },  // [확대] 기본 배율 · 다가오는 시간(ms) · 등장 후 시작까지(ms) · 확대 중심(가로% 세로%, 얼굴 위치)
  font: { title:'Zen Kaku Gothic New', text:'Gothic A1', flood:'Nanum Myeongjo' },
                      // 글꼴(구글 폰트 이름). title=제목·메뉴, text=대사·이름·선택지, flood=[반복] 글
                      // 다른 후보 — 딱딱한 고딕: 'IBM Plex Sans KR' / 옛 명조: 'Song Myung', 'Noto Serif KR'
  scar: { on:true, color:'#7d0614', draw:1600 },  // [CG 흉터]를 그림 없이 흰 바탕에 핏빛 줄 하나로 그림. color=핏빛(더 어둡게/밝게는 색 코드만 바꾸기), draw=그어지는 시간(ms). on:false면 회색 임시 판
  offBlock: { on:true, msgs:['시스템을 종료할 수 없습니다.', '종료할 수 없습니다.\n아직 노래가 끝나지 않았습니다.', '어디 가, 오빠?'] },
                      // 작업 표시줄 「시작 → 시스템 종료」를 눌러도 꺼지지 않고 이 문구가 차례로 뜸(마지막 문구는 반복). on:false면 원래대로 꺼짐
  preload: true,      // 처음 열 때 그림을 전부 미리 불러 둠 → 장면이 바뀔 때 바로 뜸. 끄려면 false
  showPh: false,      // 그림 주소를 비워 둔 칸에 회색 「(임시)」 판을 보여 줄지. 새 그림 자리를 확인할 때만 true
  maxW: 860,          // 넓은 화면에서 게임 창 최대 폭(px)
  embedSignal: true,  // 러브로그용 신호 (마지막 장면에서 카테고리·위젯 열기). 컴퓨터에서 파일로 열어 볼 때는 false
  demoBar: false      // 아래 「시안 확인용」 줄 (장면 건너뛰기). 고치면서 확인할 때만 true
};

/* ═══════════════════════════════════════════════
   2. 그림 목록 — 이름 : 주소
   대본에서 [배경 거실] [등장 토와] [CG 흉터] 처럼 이 이름으로 부릅니다.
   표정을 나누려면 '토와:웃음' 처럼 이름 뒤에 :표정 을 붙여 추가하세요.
   주소를 비워 두면 회색 임시 판이 나옵니다.
   ═══════════════════════════════════════════════ */
const IMG = {
  '타이틀':     'img/title.jpg',   // 타이틀 화면 그림 (4:3 가로)
  '현관':       'img/genkan.jpg',   // 배경: 오피스텔 현관
  '거실':       'img/living.jpg',   // 배경: 거실
  '거실:텅빔':       'img/living-empty.jpg',   // 배경: 텅빈 거실.
  '피아노':     'img/piano.jpg',   // 배경: 방 구석 전자피아노
  '토와':       'img/towa.png',   // 서 있는 그림: 기본 (배경 투명 PNG)
  '토와:웃음':  'img/towa.png',   // 서 있는 그림: 웃는 얼굴
  '토와:호러웃음': 'img/towa-horror.png',   // 서 있는 그림: 섬뜩한 웃음
  '토와:무표정': 'img/towa.png',  // 서 있는 그림: 표정 없음
  '흉터':       '',   // 이벤트 그림(CG). 비워 두면 흰 바탕에 핏빛 줄이 자동으로 그어짐 (그림 주소를 적으면 그 그림이 우선)

function paint(box, key, label, fade){

/* 흉터 — 그림 없이 흰 바탕에 대각선 핏빛 줄 하나. 가운데가 굵고 끝은 가늘며 가장자리는 살짝 거침 */
function scarSvg(){
  const P0=[205,92], P1=[392,214], P2=[612,368];            // 시작 · 휘는 점 · 끝 (800×600 기준)
  const pt = t => [ (1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0], (1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1] ];
  const nm = t => { const e=.001, a=pt(Math.max(0,t-e)), b=pt(Math.min(1,t+e)); const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [-dy/l, dx/l]; };
  const L=[], R=[]; let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for (let i=0;i<=60;i++){ const t=i/60, c=pt(t), n=nm(t), w=(Math.pow(Math.sin(Math.PI*t),.55)*5.2 + .35) * (.82 + rnd()*.36);
    L.push([c[0]+n[0]*w, c[1]+n[1]*w]); R.push([c[0]-n[0]*w*(.85+rnd()*.3), c[1]-n[1]*w*(.85+rnd()*.3)]); }
  const poly = L.concat(R.reverse()).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const mid = 'M'+P0.join(',')+' Q'+P1.join(',')+' '+P2.join(',');
  const col = SET.scar.color;
  return `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <filter id="scrough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
      <mask id="scmask" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="600"><path class="draw" d="${mid}" pathLength="1" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="butt"/></mask>
    </defs>
    <g mask="url(#scmask)"><polygon points="${poly}" fill="${col}" filter="url(#scrough)"/></g>
  </svg>`;
}

const AU = { ctx:null, master:null, els:{}, cur:null };
function ac(){
  if (!AU.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.gain.value = MUTED ? 0 : 1; AU.master.connect(AU.ctx.destination); }
  if (AU.ctx.state === 'suspended') AU.ctx.resume();
  return AU.ctx;
}
function seChime(){
  const c = ac(); if (!c || !SET.sound.se || MUTED) return; const t = c.currentTime;
  const out = c.createGain(); out.gain.value = SET.sound.seVol * .45;
  const dl = c.createDelay(); dl.delayTime.value = .21; const fb = c.createGain(); fb.gain.value = .34;
  const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2200;
  out.connect(AU.master); out.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(AU.master);
  [[554.37,.5],[587.33,.42],[830.61,.16],[1174.66,.07]].forEach(([f,g]) => {
    const o = c.createOscillator(); o.type='sine'; o.frequency.value = f; o.detune.value = Math.random()*8-4;
    const e = c.createGain(); e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+.006); e.gain.exponentialRampToValueAtTime(.0006,t+2.8);
    o.connect(e); e.connect(out); o.start(t); o.stop(t+2.9);
  });
}
function seClick(){
  const c = ac(); if (!c || !SET.sound.se || MUTED) return; const t = c.currentTime;
  const o = c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(880,t+.05);
  const e = c.createGain(); e.gain.setValueAtTime(SET.sound.seVol*.2,t); e.gain.exponentialRampToValueAtTime(.0005,t+.07);
  o.connect(e); e.connect(AU.master); o.start(t); o.stop(t+.08);
}
function bgmEl(key){
  const url = SET.sound[key]; if (!url) return null;
  if (AU.els[key]) return AU.els[key];
  const a = new Audio(); a.loop = true; a.preload = 'auto'; a.src = url;
  let same = false; try { same = new URL(url, location.href).origin === location.origin; } catch(e){}
  const rec = { a, g:null }, c = ac();
  if (c && same){ const src = c.createMediaElementSource(a); rec.g = c.createGain(); rec.g.gain.value = 0; src.connect(rec.g); rec.g.connect(AU.master); }
  else a.volume = 0;   // 다른 주소의 파일은 아이폰에서 페이드가 안 됨 → 같은 GitHub 저장소에 올리기
  AU.els[key] = rec; return rec;
}
function fadeTo(rec, v, sec){
  if (!rec) return;
  if (rec.g){ const t = AU.ctx.currentTime; rec.g.gain.cancelScheduledValues(t); rec.g.gain.setValueAtTime(rec.g.gain.value, t); rec.g.gain.linearRampToValueAtTime(v, t+sec); }
  else { const a = rec.a, from = a.volume, n = 20; let k = 0; clearInterval(rec.iv);
    rec.iv = setInterval(() => { k++; try { a.volume = Math.max(0, Math.min(1, from + (v-from)*k/n)); } catch(e){} if (k>=n) clearInterval(rec.iv); }, sec*1000/n); }
  if (v === 0) setTimeout(() => { if (AU.cur !== rec) rec.a.pause(); }, sec*1000+60);
}
function bgm(key){
  const want = key && (SET.sound[key] ? key : (key==='bgm2' ? 'bgm1' : null));
  const rec = want ? bgmEl(want) : null;
  if (AU.cur === rec) return;
  if (AU.cur) fadeTo(AU.cur, 0, 1.6);
  AU.cur = rec;
  if (rec){ rec.a.muted = MUTED; const p = rec.a.play(); if (p && p.catch) p.catch(()=>{}); fadeTo(rec, SET.sound.bgmVol, 1.6); }
}
function setMute(m){

  $('spk').classList.toggle('muted', m);

    b.classList.add('ow'); let t = b.textContent;

function showDlg(s){ sysDlg({ title:SET.windowTitle, msg:s.msg, buttons:[{t:'예'},{t:'아니오',dis:true}], lockX:true }).then(next); }
/* [BGM 2] → 'bgm2', [BGM 끔] → 없음 */
function bgmKey(k){ k = String(k||'').replace(/^bgm/i,'').trim(); return (k==='끔' || k==='0') ? null : 'bgm' + (k || '1'); }
function toNvl(){ bgm('bgm2'); wipe('#08080a', () => { setMode('nvl'); NV.innerHTML=''; FL.classList.remove('on'); }).then(next); }
function nvlLine(s){
  const p=document.createElement('p'); p.innerHTML = toHtml(parse(s.s), 1e9); NV.appendChild(p);
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('in'))); st.wait = true;
}
function endScene(s){
  setMode('end'); NV.innerHTML=''; const d=document.createElement('div'); d.className='fin'; d.textContent=s.v; NV.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('in')));
  st.ended = true; $('ver').textContent = 'ver 1.02♭';
  setWinTitle(SET.windowTitle + ' (응답 없음)');
  wGame.classList.add('hang'); setTimeout(() => wGame.classList.remove('hang'), 2600);
  if (SET.embedSignal){ try { parent.postMessage({ lvEmbedH: Math.round(DESK.offsetHeight) }, '*'); } catch(e){} }
  demoNote('마지막 장면 — 실제 홈에서는 이 순간 카테고리와 위젯이 열립니다. 한 번 더 누르면 타이틀(START가 막히고 LOAD만 열림).');
}
function advance(){
  if (anyOv() || st.dlgOpen || st.busy) return;
  const tap = () => { if (SET.sound.seAdv) seClick(); };   // 대사 넘길 때 딸깍
  if (G.classList.contains('hidew')){ tap(); G.classList.remove('hidew'); return; }
  const m = G.dataset.mode;
  if (m==='title' || CH.classList.contains('on')) return;
  if (st.eyeOn){ tap(); endEye(); return; }
  if (FL.classList.contains('on')){ tap(); if (st.flooding){ clearInterval(st.flood_t); while (FL.scrollHeight <= FL.clientHeight + 4 && FL.childNodes.length < 400){ const sp=document.createElement('span'); sp.textContent=SCRIPT[st.i].s; if (Math.random()<.22) sp.className='r'; FL.appendChild(sp); } st.flooding=false; st.wait=true; } else endFlood(); return; }
  if (m==='end'){ tap(); wipe('#fff', showTitle); return; }
  if (st.typing){ if (st.slowK && !SET.slowSkip) return; tap(); finishType(); return; }
  if (st.wait){ tap(); next(); }
}
G.addEventListener('click', e => { if (e.target.closest('button,.ov')) return; advance(); });
G.addEventListener('keydown', e => { if ((e.key==='Enter' || e.key===' ') && e.target===G){ e.preventDefault(); advance(); } });

/* 타이틀 메뉴 */
$('tStart').onclick = () => { seChime(); if (!st.busy) wipe('#fff', () => startGame(0)); };
$('tCont').onclick  = () => { seChime(); if (!st.busy && st.ended) wipe('#fff', () => startGame(IDX.loop)); };
$('tCfg').onclick   = () => { seChime(); openOv('cfg'); };
$('tEnd').onclick   = () => { seChime(); closeGame(); };

/* 대사창 아래 버튼 — CONFIG와 Hide W.만 동작, 나머지는 소리만 */
QM.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; e.stopPropagation(); seClick();
  if (b.dataset.q==='CONFIG') openOv('cfg');
  else if (b.dataset.q==='HIDE') G.classList.add('hidew');
});

/* 설정 화면 */
function openOv(n){ G.querySelectorAll('.ov').forEach(o => o.classList.remove('on')); $('ov-'+n).classList.add('on'); syncCfg(); }
function closeOv(silent){
  G.querySelectorAll('.ov').forEach(o => o.classList.remove('on'));
  if (silent){ st.pending=false; return; }
  if (st.pending){ st.pending=false; next(); }
  G.focus({preventScroll:true});
}
G.querySelectorAll('[data-back]').forEach(b => b.onclick = e => { e.stopPropagation(); seClick(); closeOv(); });
function syncCfg(){ G.querySelectorAll('[data-cfg]').forEach(r => { const k=r.dataset.cfg, cur = k==='sound' ? (MUTED ? 0 : 1) : st[k];
  r.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', +o.dataset.v === cur)); }); }
G.querySelectorAll('[data-cfg]').forEach(r => r.addEventListener('click', e => { const o=e.target.closest('.opt'); if (!o) return; e.stopPropagation();
  if (r.dataset.cfg==='sound'){ ac(); setMute(o.dataset.v==='0'); } else st[r.dataset.cfg] = +o.dataset.v;
  seClick(); syncCfg(); }));

/* ═══ 옛날 창 흉내 ═══ */
let zTop = 10, narrow = false;
const tasks = { wGame:$('tkGame'), wNote:$('tkNote') };
function setWinTitle(t){ $('gTitle').textContent = t; $('tkGameT').textContent = t; }
function activate(w){ document.querySelectorAll('#desk > .win').forEach(x => x.classList.toggle('inact', x!==w)); w.style.zIndex = ++zTop; syncTask(); }
function syncTask(){ Object.entries(tasks).forEach(([id,b]) => { const w=$(id), s=w.dataset.state;
  b.hidden = s==='closed'; b.classList.toggle('on', s==='open' && !w.classList.contains('inact')); }); }
function openWin(w){ w.dataset.state='open'; w.hidden=false; activate(w); layout(); }
function minWin(w){ w.dataset.state='min'; w.hidden=true; const o=[wGame,wNote].find(x => x!==w && x.dataset.state==='open'); if (o) activate(o); else syncTask(); layout(); }
function closeWin(w){ w.dataset.state='closed'; w.hidden=true; w.classList.add('inact'); syncTask(); layout(); }
Object.entries(tasks).forEach(([id,b]) => b.onclick = () => { const w=$(id);
  if (w.dataset.state!=='open') openWin(w); else if (!w.classList.contains('inact')) minWin(w); else activate(w); });
function closeGame(){
  if (st.ended){ sysDlg({ title:SET.windowTitle, msg:'아직 끝나지 않았습니다.', icon:'!', buttons:[{t:'확인'}] }); return; }
  sysDlg({ title:SET.windowTitle, msg:'게임을 종료하시겠습니까?', buttons:[{t:'예'},{t:'아니오'}] }).then(i => { if (i===0){ closeWin(wGame); showTitle(); } });
}
document.querySelectorAll('#desk > .win').forEach(w => {
  w.addEventListener('pointerdown', () => { if (w.classList.contains('inact')) activate(w); });
  w.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); const a=b.dataset.act;
    if (a==='min') minWin(w);
    else if (a==='max'){ w.classList.toggle('max'); b.innerHTML = w.classList.contains('max')
      ? '<svg width="9" height="9" viewBox="0 0 9 9"><path fill-rule="evenodd" d="M2 0h7v6H7v3H0V3h2zM3 1v2h4v2h1V1zM1 5v3h5V5z"/></svg>'
      : '<svg width="9" height="8" viewBox="0 0 9 8"><path fill-rule="evenodd" d="M0 0h9v8H0zM1 2v5h7V2z"/></svg>'; layout(); }
    else if (a==='close'){ if (w===wGame) closeGame(); else closeWin(w); }
  });
  const tt = w.querySelector('.tt'); let drag = null;   // 제목줄 끌기 (제목줄에만 터치를 걸어 페이지 스크롤을 막지 않음)
  tt.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || narrow || w.classList.contains('max')) return;
    drag = { x:e.clientX, y:e.clientY, l:w.offsetLeft, t:w.offsetTop }; tt.setPointerCapture(e.pointerId); });
  tt.addEventListener('pointermove', e => { if (!drag) return; const W=DESK.clientWidth, H=DESK.clientHeight;
    w.style.left = Math.min(Math.max(drag.l + e.clientX - drag.x, 80 - w.offsetWidth), W - 80)+'px';
    w.style.top  = Math.min(Math.max(drag.t + e.clientY - drag.y, 0), H - 60)+'px'; w.dataset.placed='1'; });
  const end = () => { if (drag){ drag=null; layout(); } };
  tt.addEventListener('pointerup', end); tt.addEventListener('pointercancel', end);
  tt.addEventListener('dblclick', e => { if (!e.target.closest('button') && w===wGame) w.querySelector('[data-act=max]').click(); });
});
function sysDlg({ title, msg, icon='?', buttons, lockX }){
  return new Promise(res => {
    st.dlgOpen = true;
    const bl=document.createElement('div'); bl.className='blk';
    const d=document.createElement('div'); d.className='win dlg'; d.setAttribute('role','dialog');
    d.innerHTML = `<div class="tt"><span class="nm">${esc(title)}</span><button class="tbtn x" type="button" data-x ${lockX?'disabled':''} aria-label="닫기"><svg width="8" height="7" viewBox="0 0 8 7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg></button></div>
      <div class="dbody"><i class="dic">${esc(icon)}</i><p>${esc(msg)}</p></div><div class="drow"></div>`;
    const row = d.querySelector('.drow');
    const done = i => { seClick(); bl.remove(); d.remove(); st.dlgOpen=false; activate(wGame); G.focus({preventScroll:true}); res(i); };
    buttons.forEach((b,i) => { const e=document.createElement('button'); e.type='button'; e.className='btn98'; e.textContent=b.t; e.disabled=!!b.dis; e.onclick=() => done(i); row.appendChild(e); });
    d.querySelector('[data-x]').onclick = () => done(buttons.length-1);
    DESK.appendChild(bl); DESK.appendChild(d);
    document.querySelectorAll('#desk > .win').forEach(x => x.classList.add('inact'));
    const ref = wGame.hidden ? { offsetLeft:0, offsetTop:0, offsetWidth:DESK.clientWidth, offsetHeight:DESK.clientHeight-30 } : wGame;
    d.style.left = Math.max(8, Math.min(ref.offsetLeft + (ref.offsetWidth - d.offsetWidth)/2, DESK.clientWidth - d.offsetWidth - 8)) + 'px';
    d.style.top  = Math.max(8, ref.offsetTop + (ref.offsetHeight - d.offsetHeight)/2) + 'px';
    const f = row.querySelector('button:not(:disabled)'); if (f) f.focus({preventScroll:true});
  });
}
function layout(){
  const W = DESK.clientWidth; narrow = W < 640; DESK.classList.toggle('narrow', narrow);
  const full = narrow || wGame.classList.contains('max');
  if (full){ wGame.style.left='0px'; wGame.style.top='0px'; wGame.style.width=W+'px'; }
  else { const w = Math.min(W - 120, SET.maxW); wGame.style.width = w+'px';
    if (!wGame.dataset.placed){ wGame.style.left = Math.round(Math.max(100, (W - w)/2 + 30))+'px'; wGame.style.top = '18px'; } }
  wNote.style.width = Math.min(420, W - 16)+'px';
  if (!wNote.dataset.placed){ wNote.style.left = (narrow ? 8 : 110)+'px'; wNote.style.top = (narrow ? 40 : 70)+'px'; }
  const gb = wGame.hidden ? 0 : wGame.offsetTop + wGame.offsetHeight;
  const need = Math.max(gb + 30 + (full ? 0 : 22), 360);
  DESK.style.height = Math.max(need, window.innerHeight - (SET.demoBar && $('demo') ? $('demo').offsetHeight : 0)) + 'px';
}
let lastW = 0;
new ResizeObserver(() => { const w = DESK.clientWidth; if (w !== lastW){ lastW = w; layout(); } }).observe(DESK);
window.addEventListener('resize', layout);

document.querySelectorAll('.ic').forEach(ic => ic.addEventListener('click', e => {
  e.stopPropagation();
  if (!ic.classList.contains('sel')){ document.querySelectorAll('.ic').forEach(x => x.classList.toggle('sel', x===ic)); return; }
  ic.classList.remove('sel'); openThing(ic.dataset.ic);
}));
function openThing(k){
  if (k==='game'){ if (wGame.dataset.state==='closed') showTitle(); openWin(wGame); }
  else if (k==='note') openWin(wNote);
  else if (k==='bin') sysDlg({ title:'휴지통', msg:'휴지통이 비어 있습니다.', icon:'i', buttons:[{t:'확인'}] });
}
const SM = $('sm'); let offTry = 0;   // 시스템 종료를 누른 횟수
$('start').onclick = e => { e.stopPropagation(); SM.hidden = !SM.hidden; $('start').classList.toggle('on', !SM.hidden); };
document.addEventListener('pointerdown', e => {
  if (!SM.hidden && !e.target.closest('#sm,#start')){ SM.hidden=true; $('start').classList.remove('on'); }
  if (!e.target.closest('.ic')) document.querySelectorAll('.ic').forEach(x => x.classList.remove('sel'));
});
SM.addEventListener('click', e => { const b=e.target.closest('[data-sm]'); if (!b) return; SM.hidden=true; $('start').classList.remove('on');
  const k=b.dataset.sm;
  if (k==='game' || k==='note') openThing(k);
  else if (k==='reset') resetAll();
  else if (k==='off'){
    if (!SET.offBlock || !SET.offBlock.on){ $('off').hidden=false; clearTimers(); bgm(null); return; }
    const L = SET.offBlock.msgs || ['시스템을 종료할 수 없습니다.'], n = Math.min(offTry++, L.length - 1);
    sysDlg({ title:'시스템 종료', msg:L[n], icon:'!', buttons:[{t:'확인'}], lockX: n === L.length - 1 });
  }
});
$('off').onclick = () => { $('off').hidden=true; resetAll(); };
function resetAll(){ st.ended=false; $('ver').textContent='ver 1.02'; closeWin(wNote); wGame.classList.remove('max'); delete wGame.dataset.placed; openWin(wGame); showTitle(); }
function tick(){ const d=new Date(), h=d.getHours(); $('clock').textContent = (h<12?'오전 ':'오후 ') + ((h%12)||12) + ':' + String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 15000);

/* 시안 확인용 줄 */
function demoNote(t){ const n=$('demoNote'); if (n) n.textContent = t; }
if (!SET.demoBar) $('demo').remove();
else $('demo').addEventListener('click', e => { const b=e.target.closest('[data-j]'); if (!b || st.busy) return; const j=b.dataset.j;
  if (j==='reset'){ resetAll(); demoNote('처음 상태로 돌렸습니다.'); return; }
  if (wGame.dataset.state!=='open') openWin(wGame);
  if (j==='title'){ showTitle(); demoNote('타이틀 화면.'); return; }
  startGame(j in IDX ? IDX[j] : +j);
  demoNote({ '0':'평범한 미연시 부분.', loop:'고장 시작 — 같은 날짜가 다시 나옵니다.', dlg:'「아니오」가 눌리지 않는 확인창.', nvl:'반전 뒤 — 화면 가득 글.', end:'마지막 장면.' }[j] || '');
});

setMute(MUTED); showTitle(); activate(wGame); layout();
</script>
</body>
</html>
