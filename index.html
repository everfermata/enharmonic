<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>合言葉 — enharmonic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ===== 모양 (옵션 설정은 아래쪽 CONFIG에 있어요) ===== */
:root{--ink:#111;--paper:#fff;--line:#d6d6d6;--mute:#555;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --dot:"DotGothic16","Noto Sans KR",monospace;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;min-height:300px}
/* 위쪽 표시줄 */
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ink);font-family:var(--dot);font-size:13px;letter-spacing:.08em}
#lives{display:flex;gap:6px;align-items:center}
#lives svg{width:14px;height:22px;transition:opacity .3s,transform .3s}
#lives svg.off{opacity:.15;transform:translateY(5px) rotate(18deg)}
/* 하늘(오선) */
#field{position:relative;flex:1;overflow:hidden;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px)}
#ground{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ink)}
.w{position:absolute;top:0;left:0;white-space:nowrap;font-family:var(--mincho);font-weight:800;font-size:17px;line-height:1;
  padding:6px 10px;background:var(--paper);border:1px solid var(--ink);will-change:transform}
.w.hit{border-color:var(--line);color:var(--mute);text-decoration:line-through;transition:opacity .35s;opacity:0}
.w.miss{background:var(--ink);color:#fff;transition:opacity .4s;opacity:0}
/* 아래 입력줄 */
#in{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ink);background:var(--paper)}
#txt{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);outline:0;
  -webkit-user-select:text;user-select:text}
#txt::placeholder{color:#8a8a8a}
#txt:focus{box-shadow:0 0 0 2px var(--ink) inset}
#go{font:inherit;font-family:var(--dot);padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:0;cursor:pointer}
#go:active{background:#fff;color:var(--ink)}
#txt.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* 시작·끝 화면 */
.scr{position:absolute;inset:0;z-index:5;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.scr[hidden]{display:none}
.scr h1{margin:0;font-family:var(--mincho);font-weight:800;font-size:54px;letter-spacing:.1em;line-height:1}
.scr .sub{font-family:var(--dot);font-size:12px;letter-spacing:.2em;color:var(--mute)}
.scr p{margin:0;max-width:300px;font-size:13px;line-height:1.7;color:#333}
.scr .q{font-family:var(--mincho);font-weight:500;font-size:15px;line-height:1.8;color:var(--ink)}
.scr .num{font-family:var(--dot);font-size:34px}
.btn{font-family:var(--dot);font-size:14px;letter-spacing:.2em;padding:11px 26px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:0;cursor:pointer}
.btn:active{background:#fff;color:var(--ink)}
.rest{display:inline-block;vertical-align:middle}
</style></head><body>
<div id="app">
  <div id="bar">
    <span>合言葉 <span id="score">0</span></span>
    <span id="lives" aria-label="목숨"></span>
  </div>
  <div id="field">
    <div id="ground"></div>
    <div class="scr" id="start">
      <div class="sub">PASSWORD</div>
      <h1>合言葉</h1>
      <p>空から降ってくる彼の言葉。<br>どんな言葉にも、答えは同じ。</p>
      <p>떨어지는 말은 전부 일본어지만,<br>입력할 말은 하나뿐입니다.<br><b style="font-size:18px">사랑해</b><br>닿기 전에 입력하고 Enter.<br>일본어를 복사해 붙여도 소용없어요.</p>
      <button class="btn" id="startBtn">始める</button>
    </div>
    <div class="scr" id="end" hidden>
      <div class="sub">FINE</div>
      <div class="num"><span id="fin">0</span></div>
      <div class="q" id="endq"></div>
      <div class="sub" id="bestline"></div>
      <button class="btn" id="again">もう一度</button>
    </div>
  </div>
  <form id="in" autocomplete="off">
    <input id="txt" type="text" placeholder="사랑해" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="합言葉 입력">
    <button id="go" type="submit">Enter</button>
  </form>
</div>
<script>
/* ============ 설정 (여기만 고치면 됩니다) ============ */
var CONFIG = {
  answer: '사랑해',      // 정답 글자. 이걸 입력해야 말이 사라져요
  lives: 3,              // 목숨(♭) 개수
  startSpeed: 38,        // 처음 떨어지는 속도 (px/초). 클수록 빠름
  maxSpeed: 120,         // 가장 빠를 때 속도
  speedUpEvery: 5,       // 몇 개 지울 때마다 빨라지는지
  spawnStart: 2600,      // 처음 말이 나오는 간격 (밀리초)
  spawnMin: 1000,        // 가장 빠를 때 간격
  autoSubmit: true,      // true: 정답 글자가 완성되면 Enter 없이 바로 처리 / false: Enter만
  lines: [               // 떨어지는 대사 (일본어). 자유롭게 추가·삭제
    '俺だけを見ていろ。',
    '逃げるな。',
    '声が出ないなら、目で言え。',
    '他の誰にも、触らせるな。',
    '今日も、俺の隣にいろ。',
    '弾けるまで、帰さない。',
    '嘘でもいいから、言え。',
    'ちゃんと俺だけを求めなきゃ。',
    '離れるな。',
    '指一本、他に貸すな。'
  ],
  endLines: [            // 끝났을 때 보여 줄 한 줄
    'ちゃんと正気配の目で、俺だけを求めなきゃ。',
    '……聞こえなかった。もう一度。',
    '間に合わなかったな。'
  ]
};
/* ====================================================== */
(function(){
  var $=function(i){return document.getElementById(i)};
  var field=$('field'),txt=$('txt'),form=$('in'),scoreEl=$('score'),livesEl=$('lives');
  var FLAT='<svg viewBox="0 0 14 22" aria-hidden="true"><path d="M3 0v18.5M3 12.5c3-3 9-2 9 2.3 0 3-4 5.2-9 5.2" fill="none" stroke="#111" stroke-width="1.8"/></svg>';
  var words=[],score=0,lives=0,running=false,last=0,nextSpawn=0,cleared=0,raf=0,lastCol=-1;
  var best=0;
  try{best=parseInt(localStorage.getItem('enh_best')||'0',10)||0}catch(e){}

  function drawLives(){
    var h='';
    for(var i=0;i<CONFIG.lives;i++)h+=FLAT;
    livesEl.innerHTML=h;
    var s=livesEl.children;
    for(var j=0;j<s.length;j++)if(j>=lives)s[j].setAttribute('class','off');
  }
  function speed(){return Math.min(CONFIG.maxSpeed,CONFIG.startSpeed+Math.floor(cleared/CONFIG.speedUpEvery)*9)}
  function gap(){return Math.max(CONFIG.spawnMin,CONFIG.spawnStart-Math.floor(cleared/CONFIG.speedUpEvery)*220)}

  function spawn(){
    var fw=field.clientWidth,t=CONFIG.lines[Math.floor(Math.random()*CONFIG.lines.length)];
    var el=document.createElement('div');el.className='w';el.textContent=t;field.appendChild(el);
    var w=el.offsetWidth,maxX=Math.max(0,fw-w-8);
    var x=4+Math.random()*maxX;
    if(maxX>60&&Math.abs(x-lastCol)<w*0.5)x=4+((x-4+maxX/2)%(maxX+1)); // 직전 말과 겹치지 않게
    lastCol=x;
    var o={el:el,x:x,y:-el.offsetHeight-4,h:el.offsetHeight};
    el.style.transform='translate('+x+'px,'+o.y+'px)';
    words.push(o);
  }
  function lose(o){
    lives--;drawLives();
    o.el.classList.add('miss');
    setTimeout(function(){if(o.el.parentNode)o.el.parentNode.removeChild(o.el)},420);
    if(lives<=0)end();
  }
  function tick(ts){
    if(!running)return;
    if(!last)last=ts;
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    var fh=field.clientHeight-3,sp=speed();
    if(ts>=nextSpawn){spawn();nextSpawn=ts+gap()}
    for(var i=words.length-1;i>=0;i--){
      var o=words[i];o.y+=sp*dt;
      if(o.y+o.h>=fh){words.splice(i,1);o.y=fh-o.h;o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';lose(o);if(!running)return}
      else o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';
    }
    raf=requestAnimationFrame(tick);
  }
  function clearLowest(){
    if(!words.length)return false;
    var k=0;for(var i=1;i<words.length;i++)if(words[i].y>words[k].y)k=i;
    var o=words.splice(k,1)[0];
    o.el.classList.add('hit');
    setTimeout(function(){if(o.el.parentNode)o.el.parentNode.removeChild(o.el)},380);
    score++;cleared++;scoreEl.textContent=score;
    return true;
  }
  /* 입력칸을 새것으로 바꿔요. 한글은 마지막 글자가 '조합 중'이라 value만 비우면 마지막 글자('해')가 다시 살아나는데,
     입력칸 자체를 새로 만들면 그 찌꺼기가 사라집니다. */
  function resetInput(shake){
    var n=txt.cloneNode(false);n.value='';n.removeAttribute('class');
    txt.parentNode.replaceChild(n,txt);txt=n;
    if(shake){void txt.offsetWidth;txt.classList.add('shake')}
    try{txt.focus({preventScroll:true})}catch(e){txt.focus()}
  }
  function norm(s){return (s||'').normalize('NFC').replace(/\s+/g,'')}
  function submit(){
    if(!running)return;
    var v=norm(txt.value);
    if(v===norm(CONFIG.answer)){clearLowest();resetInput(false)}
    else if(v){resetInput(true)}
  }
  function end(){
    running=false;cancelAnimationFrame(raf);
    $('fin').textContent=score;
    var nb=score>best;if(nb){best=score;try{localStorage.setItem('enh_best',String(best))}catch(e){}}
    $('bestline').textContent=(nb&&score>0?'NEW BEST  ':'BEST  ')+best;
    $('endq').textContent=CONFIG.endLines[Math.floor(Math.random()*CONFIG.endLines.length)];
    setTimeout(function(){$('end').hidden=false},650);
  }
  function start(){
    for(var i=0;i<words.length;i++)if(words[i].el.parentNode)words[i].el.parentNode.removeChild(words[i].el);
    words=[];score=0;cleared=0;lives=CONFIG.lives;last=0;nextSpawn=0;lastCol=-1;
    scoreEl.textContent='0';drawLives();
    $('start').hidden=true;$('end').hidden=true;
    running=true;resetInput(false);
    raf=requestAnimationFrame(tick);
  }
  $('startBtn').addEventListener('click',start);
  $('again').addEventListener('click',start);
  $('in').addEventListener('submit',function(e){e.preventDefault();submit()});
  form.addEventListener('input',function(e){
    if(e.target!==txt)return;
    if(CONFIG.autoSubmit&&norm(txt.value)===norm(CONFIG.answer))submit();
  });
  /* 붙여넣기·드래그·우클릭 가볍게 막기 (일본어 복사 방지) */
  ['paste','drop','contextmenu','dragstart','copy','cut'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
  document.addEventListener('visibilitychange',function(){last=0});
  field.addEventListener('pointerdown',function(){if(running){try{txt.focus({preventScroll:true})}catch(e){}}});
  drawLives();
})();
</script></body></html>
