<!-- 合言葉 게임 수정본3 (調律室 · 도트 화면). GitHub 저장소의 index.html 을 이 파일로 교체 (파일 이름 그대로). 러브로그 쪽은 그대로 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 모양 (調律室 · 수정본2) — 옵션 설정은 아래쪽 CONFIG에 있어요. 게임 동작·소리는 수정본1과 같습니다 ===== */
:root{--ink:#101011;--paper:#fff;--line:#2a2a2d;--mute:#a9a9ad;--lit:#f5f5f3;--well:#f1f1ef;
  --sink:inset 0 2px 5px rgba(0,0,0,.22),inset 0 0 0 1px rgba(0,0,0,.08);
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans KR",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* 흰 기계 본체 (아래 34px은 그림자 자리) */
#app{position:absolute;left:2px;right:2px;top:2px;bottom:34px;display:flex;flex-direction:column;gap:12px;min-height:300px;padding:14px;
  border:1px solid #dededb;border-radius:16px;background:linear-gradient(#fff,#fbfbfa 30%,#f1f1ef);
  box-shadow:0 1px 0 #fff inset,0 16px 24px -16px rgba(0,0,0,.36),0 3px 8px rgba(0,0,0,.06)}
/* 위쪽 표시줄: 점수 + 목숨(♭) */
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font:800 16px/1 var(--mincho);letter-spacing:.06em}
#score{display:inline-block;min-width:2.2em;margin-left:6px;padding:5px 8px 4px;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px);background:#0d0d0e;color:var(--lit);text-align:center;font-variant-numeric:tabular-nums}
#lives{display:flex;gap:6px;align-items:center}
#lives svg{width:14px;height:22px;transition:opacity .3s,transform .3s}
#lives svg.off{opacity:.15;transform:translateY(5px) rotate(18deg)}
/* 하늘 = 검은 화면창 */
/* 하늘 = 작은 점(LED)이 촘촘한 도트 화면. 위에서 도트 빗방울이 내림 */
#field{container-type:size;position:relative;flex:1;overflow:hidden;border-radius:10px 10px 0 0;color:var(--lit);
  background:linear-gradient(90deg,#070708 1px,transparent 1px) 0 0/4px 4px,linear-gradient(#070708 1px,transparent 1px) 0 0/4px 4px,#18181a;
  box-shadow:inset 0 0 0 1px #000,inset 0 3px 12px rgba(0,0,0,.9)}
#field::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='112'%20height='200'%20viewBox='0%200%2056%20100'%20shape-rendering='crispEdges'%3E%3Cg%20fill='%23f5f5f3'%3E%3Crect%20x='3'%20y='2'%20width='1'%20height='3'/%3E%3Crect%20x='3'%20y='7'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='17'%20y='30'%20width='1'%20height='3'/%3E%3Crect%20x='17'%20y='35'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='9'%20y='58'%20width='1'%20height='3'/%3E%3Crect%20x='9'%20y='63'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='27'%20y='12'%20width='1'%20height='3'/%3E%3Crect%20x='27'%20y='17'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='36'%20y='44'%20width='1'%20height='3'/%3E%3Crect%20x='36'%20y='49'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='45'%20y='70'%20width='1'%20height='3'/%3E%3Crect%20x='45'%20y='75'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='52'%20y='24'%20width='1'%20height='3'/%3E%3Crect%20x='52'%20y='29'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='21'%20y='80'%20width='1'%20height='3'/%3E%3Crect%20x='21'%20y='85'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='40'%20y='4'%20width='1'%20height='3'/%3E%3Crect%20x='40'%20y='9'%20width='1'%20height='1'%20opacity='.5'/%3E%3Crect%20x='6'%20y='90'%20width='1'%20height='3'/%3E%3Crect%20x='6'%20y='95'%20width='1'%20height='1'%20opacity='.5'/%3E%3C/g%3E%3C/svg%3E") 0 0/112px 200px;animation:rain 2.6s steps(26) infinite}
@keyframes rain{to{background-position:0 200px}}
#field::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(115deg,rgba(255,255,255,.05) 0 22%,transparent 22.4%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:2px;background:#f5f5f3;opacity:.6}
/* 바닥 = 도트 피아노 (대사가 여기에 닿으면 목숨이 줄어듦) */
#px{flex:none;height:30px;margin-top:-12px;border-radius:0 0 10px 10px;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='112'%20height='26'%20viewBox='0%200%2056%2013'%20shape-rendering='crispEdges'%3E%3Crect%20width='56'%20height='13'%20fill='%230b0b0c'/%3E%3Crect%20x='0'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='0'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='8'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='8'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='16'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='16'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='24'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='24'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='32'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='32'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='40'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='40'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='48'%20y='0'%20width='7'%20height='12'%20fill='%23f5f5f3'/%3E%3Crect%20x='48'%20y='10'%20width='7'%20height='2'%20fill='%23c9c9c6'/%3E%3Crect%20x='5'%20y='0'%20width='5'%20height='7'%20fill='%230b0b0c'/%3E%3Crect%20x='6'%20y='6'%20width='3'%20height='1'%20fill='%233a3a3d'/%3E%3Crect%20x='13'%20y='0'%20width='5'%20height='7'%20fill='%230b0b0c'/%3E%3Crect%20x='14'%20y='6'%20width='3'%20height='1'%20fill='%233a3a3d'/%3E%3Crect%20x='29'%20y='0'%20width='5'%20height='7'%20fill='%230b0b0c'/%3E%3Crect%20x='30'%20y='6'%20width='3'%20height='1'%20fill='%233a3a3d'/%3E%3Crect%20x='37'%20y='0'%20width='5'%20height='7'%20fill='%230b0b0c'/%3E%3Crect%20x='38'%20y='6'%20width='3'%20height='1'%20fill='%233a3a3d'/%3E%3Crect%20x='45'%20y='0'%20width='5'%20height='7'%20fill='%230b0b0c'/%3E%3Crect%20x='46'%20y='6'%20width='3'%20height='1'%20fill='%233a3a3d'/%3E%3C/svg%3E") 0 2px/112px 26px repeat-x,#0b0b0c;image-rendering:pixelated;
  box-shadow:inset 0 0 0 1px #000,0 1px 0 #fff}
.w{position:absolute;top:0;left:0;max-width:calc(100% - 8px);font-family:var(--mincho);font-weight:800;font-size:17px;line-height:1.35;
  /* 칸이 좁으면 긴 대사는 두 줄로 접힘 */
  padding:8px 12px;background:var(--lit);color:var(--ink);clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px);will-change:transform}
/* 맞히면 점이 성기게 흩어지며 사라짐 / 놓치면 검게 뒤집힘 */
.w.hit{background:repeating-conic-gradient(var(--lit) 0 25%,transparent 0 50%) 0 0/4px 4px;color:transparent;transition:opacity .4s;opacity:0}
.w.miss{background:#0b0b0c;color:var(--lit);outline:2px solid var(--lit);outline-offset:-4px;transition:opacity .45s;opacity:0}
/* 아래 입력줄 */
#in{flex:none;display:flex;gap:10px;align-items:center}
#txt{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border:0;border-radius:10px;background:var(--well);box-shadow:var(--sink);color:var(--ink);outline:0;
  -webkit-user-select:text;user-select:text}
#txt::placeholder{color:#8d8d92}
#txt:focus{box-shadow:var(--sink),0 0 0 2px var(--ink)}
#go{flex:none;font:700 14px/1 var(--sans);padding:13px 18px;border:0;border-radius:9px;cursor:pointer;color:var(--ink);
  background:linear-gradient(#fff,#f1f1ef);box-shadow:0 5px 0 #cfcfcc,0 14px 16px -8px rgba(0,0,0,.35),inset 0 0 0 1px #dededb;transition:transform .12s,box-shadow .12s}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #cfcfcc,0 4px 6px -3px rgba(0,0,0,.35),inset 0 0 0 1px #dededb}
#txt.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* 시작·끝 화면 (검은 화면창 안) */
.scr{position:absolute;inset:0;z-index:5;background:linear-gradient(90deg,#070708 1px,transparent 1px) 0 0/4px 4px,linear-gradient(#070708 1px,transparent 1px) 0 0/4px 4px,rgba(24,24,26,.96);color:var(--lit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.scr[hidden]{display:none}
.scr h1{margin:0;font-family:var(--mincho);font-weight:800;font-size:52px;letter-spacing:.14em;text-indent:.14em;line-height:1}
.scr .sub{font-size:13px;letter-spacing:.08em;color:var(--mute)}
.scr p{margin:0;max-width:300px;font-size:13px;line-height:1.75;color:#d2d2d4}
.scr p b{color:var(--lit)}
.scr .q{font-family:var(--mincho);font-weight:600;font-size:15px;line-height:1.8;color:var(--lit)}
.scr .num{font:800 46px/1 var(--mincho);font-variant-numeric:tabular-nums}
.btn{font:700 15px/1 var(--sans);letter-spacing:.34em;text-indent:.34em;padding:14px 30px;border:0;border-radius:9px;cursor:pointer;color:var(--ink);
  background:linear-gradient(#fff,#e9e9e6);box-shadow:0 5px 0 #8d8d92,0 14px 18px -8px rgba(0,0,0,.6);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8d8d92,0 4px 6px -3px rgba(0,0,0,.6)}
.rest{display:inline-block;vertical-align:middle}
/* ---- 시작 화면 크기 맞춤: 화면창 크기(폭·높이)에 따라 글자·간격이 줄고 늘어서 잘리지 않습니다 ----
   · 좁은 곳(대문 밖 옆 칸)이나 낮은 칸에서는 자동으로 작아지고,
   · 넓은 곳(PC 대문)에서는 글을 왼쪽·오른쪽 두 덩어리로 나눠 위아래가 답답하지 않게 합니다 */
#start{gap:clamp(6px,2.6cqh,14px);padding:clamp(10px,4cqh,24px) clamp(12px,5cqw,28px)}
#start h1{font-size:clamp(30px,min(19cqw,14cqh),52px)}
#start p{font-size:clamp(11px,min(4.6cqw,3.5cqh),13px);line-height:1.7;max-width:100%}
#start p b{font-size:clamp(14px,min(6cqw,4.6cqh),18px) !important}
#start .btn{padding:clamp(10px,3.4cqh,14px) clamp(22px,7cqw,30px);font-size:clamp(13px,min(5cqw,4cqh),15px)}
@container (min-width:520px){
  #start{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;align-content:center;justify-content:center;column-gap:clamp(24px,6cqw,56px);row-gap:clamp(8px,3cqh,16px);
    max-width:100%;padding:clamp(16px,5cqh,32px) clamp(24px,6cqw,56px)}
  #start h1{grid-column:1;grid-row:1;align-self:end;font-size:clamp(40px,min(10cqw,17cqh),64px)}
  #start p:nth-of-type(1){grid-column:1;grid-row:2;align-self:start;font-size:clamp(12px,min(2.2cqw,3.6cqh),15px)}
  #start p:nth-of-type(2){grid-column:2;grid-row:1/3;align-self:center;padding-left:clamp(18px,3cqw,34px);border-left:1px solid #3a3a3d;text-align:left;font-size:clamp(12px,min(2.2cqw,3.6cqh),15px)}
  #start p:nth-of-type(2) b{display:inline-block;margin:.25em 0}
  #start .btn{grid-column:1/-1;grid-row:3;justify-self:center;margin-top:clamp(4px,2cqh,12px)}
}
@media (max-width:380px){#app{padding:10px;gap:10px}.scr h1{font-size:42px}}
</style></head><body>
<div id="app">
  <div id="bar">
    <span>合言葉 <span id="score">0</span></span>
    <span id="lives" aria-label="목숨"></span>
  </div>
  <div id="field">
    <div id="ground"></div>
    <div class="scr" id="start">
      <h1>合言葉</h1>
      <p>空から降ってくる彼の言葉。<br>どんな言葉にも、答えは同じ。</p>
      <p>떨어지는 말은 전부 일본어지만,<br>입력할 말은 하나뿐입니다.<br><b style="font-size:18px">사랑해</b><br>닿기 전에 입력하고 Enter.<br>일본어를 복사해 붙여도 소용없어요.</p>
      <button class="btn" id="startBtn">始める</button>
    </div>
    <div class="scr" id="end" hidden>
      <div class="num"><span id="fin">0</span></div>
      <div class="q" id="endq"></div>
      <div class="sub" id="bestline"></div>
      <button class="btn" id="again">もう一度</button>
    </div>
  </div>
  <div id="px" aria-hidden="true"></div>
  <form id="in" autocomplete="off">
    <input id="txt" type="text" placeholder="사랑해" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="합言葉 입력">
    <button id="go" type="submit">Enter</button>
  </form>
</div>
<script>
/* ============ 설정 (여기만 고치면 됩니다) ============ */
var CONFIG = {
  sound: true,           // 효과음. 끄려면 false (게임 시작 / '사랑해'로 말이 사라질 때)
  soundVolume: 0.5,     // 효과음 크기 0~1
  answer: '사랑해',      // 정답 글자. 이걸 입력해야 말이 사라져요
  lives: 3,              // 목숨(♭) 개수
  startSpeed: 38,        // 처음 떨어지는 속도 (px/초). 클수록 빠름
  maxSpeed: 120,         // 가장 빠를 때 속도
  speedUpEvery: 3,       // 몇 개 지울 때마다 빨라지는지
  spawnStart: 2600,      // 처음 말이 나오는 간격 (밀리초)
  spawnMin: 1000,        // 가장 빠를 때 간격
  autoSubmit: true,      // true: 정답 글자가 완성되면 Enter 없이 바로 처리 / false: Enter만
  lines: [               // 떨어지는 대사 (일본어). 자유롭게 추가·삭제
    '刃物越しじゃ抱けないだろ。',
    '一緒に生きるんだよ、永遠。',
    '俺の隣で、息が詰まりそうなくらい苦しみながらね。',
    '俺のこの手も、これからの時間も、全部お前のものだから。',
    '俺の心臓の音も、お前を抱いてるこの身体も、嘘なんてついてない。',
    'この痛みの全部、永遠のせいだから。',
    '永遠の全部、最初から俺のものだったんだから。',
    '永遠の音は、俺が全部聞いてあげるから。',
    '逃げられるとでも思ってるわけ？',
    '痛みを分け合う方法が、傷をつけることだけだなんて思わないでよ。'
  ],
  endLines: [            // 끝났을 때 보여 줄 한 줄
    'ちゃんと正気配の目で、俺だけを求めなきゃ。',
    '……聞こえなかった。もう一度。',
    '間に合わなかったな。'
  ]
};
/* ====================================================== */
(function(){
  var $=function(i){return document.getElementById(i)};
  var field=$('field'),txt=$('txt'),form=$('in'),scoreEl=$('score'),livesEl=$('lives');
  var FLAT='<svg viewBox="0 0 14 22" aria-hidden="true"><path d="M3 0v18.5M3 12.5c3-3 9-2 9 2.3 0 3-4 5.2-9 5.2" fill="none" stroke="#101011" stroke-width="1.8"/></svg>';
  var words=[],score=0,lives=0,running=false,last=0,nextSpawn=0,cleared=0,raf=0,lastCol=-1;
  var best=0;
  try{best=parseInt(localStorage.getItem('enh_best')||'0',10)||0}catch(e){}

  function drawLives(){
    var h='';
    for(var i=0;i<CONFIG.lives;i++)h+=FLAT;
    livesEl.innerHTML=h;
    var s=livesEl.children;
    for(var j=0;j<s.length;j++)if(j>=lives)s[j].setAttribute('class','off');
  }
  function speed(){return Math.min(CONFIG.maxSpeed,CONFIG.startSpeed+Math.floor(cleared/CONFIG.speedUpEvery)*9)}
  function gap(){return Math.max(CONFIG.spawnMin,CONFIG.spawnStart-Math.floor(cleared/CONFIG.speedUpEvery)*220)}

  function spawn(){
    var fw=field.clientWidth,t=CONFIG.lines[Math.floor(Math.random()*CONFIG.lines.length)];
    var el=document.createElement('div');el.className='w';el.textContent=t;field.appendChild(el);
    var w=el.offsetWidth,maxX=Math.max(0,fw-w-8);
    var x=4+Math.random()*maxX;
    if(maxX>60&&Math.abs(x-lastCol)<w*0.5)x=4+((x-4+maxX/2)%(maxX+1)); // 직전 말과 겹치지 않게
    lastCol=x;
    var o={el:el,x:x,y:-el.offsetHeight-4,h:el.offsetHeight};
    el.style.transform='translate('+x+'px,'+o.y+'px)';
    words.push(o);
  }
  /* 효과음: 소리 파일 없이 브라우저가 직접 만들어요 (Web Audio). 시작/정답일 때만 울립니다 */
  var AC=null;
  function note(f,t0,dur,vol,type){
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol*CONFIG.soundVolume,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
  }
  function sfx(kind){
    if(!CONFIG.sound)return;
    try{
      if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
      if(AC.state==='suspended')AC.resume();
      if(kind==='start'){note(523.25,0,0.35,0.9);note(783.99,0.11,0.5,0.9)}          /* 도 → 솔 */
      else if(kind==='clear'){note(1318.5,0,0.28,0.8,'triangle');note(1975.5,0.07,0.45,0.6)} /* 맑은 두 음 */
    }catch(e){}
  }
  function lose(o){
    lives--;drawLives();
    o.el.classList.add('miss');
    setTimeout(function(){if(o.el.parentNode)o.el.parentNode.removeChild(o.el)},420);
    if(lives<=0)end();
  }
  function tick(ts){
    if(!running)return;
    if(!last)last=ts;
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    var fh=field.clientHeight-3,sp=speed();
    if(ts>=nextSpawn){spawn();nextSpawn=ts+gap()}
    for(var i=words.length-1;i>=0;i--){
      var o=words[i];o.y+=sp*dt;
      if(o.y+o.h>=fh){words.splice(i,1);o.y=fh-o.h;o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';lose(o);if(!running)return}
      else o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';
    }
    raf=requestAnimationFrame(tick);
  }
  function clearLowest(){
    if(!words.length)return false;
    var k=0;for(var i=1;i<words.length;i++)if(words[i].y>words[k].y)k=i;
    var o=words.splice(k,1)[0];
    o.el.classList.add('hit');
    setTimeout(function(){if(o.el.parentNode)o.el.parentNode.removeChild(o.el)},380);
    score++;cleared++;scoreEl.textContent=score;
    sfx('clear');
    return true;
  }
  /* 입력칸을 새것으로 바꿔요. 한글은 마지막 글자가 '조합 중'이라 value만 비우면 마지막 글자('해')가 다시 살아나는데,
     입력칸 자체를 새로 만들면 그 찌꺼기가 사라집니다. */
  function resetInput(shake){
    var n=txt.cloneNode(false);n.value='';n.removeAttribute('class');
    txt.parentNode.replaceChild(n,txt);txt=n;
    if(shake){void txt.offsetWidth;txt.classList.add('shake')}
    try{txt.focus({preventScroll:true})}catch(e){txt.focus()}
  }
  function norm(s){return (s||'').normalize('NFC').replace(/\s+/g,'')}
  function submit(){
    if(!running)return;
    var v=norm(txt.value);
    if(v===norm(CONFIG.answer)){clearLowest();resetInput(false)}
    else if(v){resetInput(true)}
  }
  function end(){
    running=false;cancelAnimationFrame(raf);
    $('fin').textContent=score;
    var nb=score>best;if(nb){best=score;try{localStorage.setItem('enh_best',String(best))}catch(e){}}
    $('bestline').textContent=(nb&&score>0?'NEW BEST  ':'BEST  ')+best;
    $('endq').textContent=CONFIG.endLines[Math.floor(Math.random()*CONFIG.endLines.length)];
    setTimeout(function(){$('end').hidden=false},650);
  }
  function start(){
    for(var i=0;i<words.length;i++)if(words[i].el.parentNode)words[i].el.parentNode.removeChild(words[i].el);
    words=[];score=0;cleared=0;lives=CONFIG.lives;last=0;nextSpawn=0;lastCol=-1;
    scoreEl.textContent='0';drawLives();
    $('start').hidden=true;$('end').hidden=true;
    running=true;sfx('start');resetInput(false);
    raf=requestAnimationFrame(tick);
  }
  $('startBtn').addEventListener('click',start);
  $('again').addEventListener('click',start);
  $('in').addEventListener('submit',function(e){e.preventDefault();submit()});
  form.addEventListener('input',function(e){
    if(e.target!==txt)return;
    if(CONFIG.autoSubmit&&norm(txt.value)===norm(CONFIG.answer))submit();
  });
  /* 붙여넣기·드래그·우클릭 가볍게 막기 (일본어 복사 방지) */
  ['paste','drop','contextmenu','dragstart','copy','cut'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
  document.addEventListener('visibilitychange',function(){last=0});
  field.addEventListener('pointerdown',function(){if(running){try{txt.focus({preventScroll:true})}catch(e){}}});
  drawLives();
})();
</script></body></html>
