<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fermata</title>
<!-- ─────────────────────────────────────────────
  luvlog.me/mio · 디데이 위젯 「Fermata」 수정본3 (調律室)
  올리는 곳: GitHub 저장소 enharmonic 맨 위의 dday-index.html 을 이 파일로 교체 (파일 이름 그대로)
  러브로그 쪽은 그대로 두면 됩니다(같은 주소). 위젯 높이는 안내문 참고.
  바꿀 것은 맨 아래 <script> 의 CONFIG 만 고치면 됩니다. (계산 방식·설정은 수정본2와 같음)
───────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 공통 부품 (모든 위젯에 같은 값이 들어 있습니다) ── */
:root{
  --w-body:#fbfbfa; --w-body2:#f1f1ef; --w-edge:#dededb; --w-ink:#101011; --w-sub:#55555a; --w-mark:#8d8d92;
  --w-lcd:#0d0d0e; --w-lcd2:#1b1b1d; --w-lit:#f5f5f3;
  --w-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --w-goth:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans KR",sans-serif;
  --w-r:16px;
  --w-lift:0 1px 0 #fff inset,0 -1px 0 rgba(0,0,0,.05) inset,0 26px 44px -26px rgba(0,0,0,.42),0 3px 8px rgba(0,0,0,.06);
  --w-sink:inset 0 2px 5px rgba(0,0,0,.22),inset 0 0 0 1px rgba(0,0,0,.08);
  --w-out:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:transparent;color:var(--w-ink);font:400 14px/1.6 var(--w-goth);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
.dev{position:relative;background:linear-gradient(180deg,#fff,var(--w-body) 30%,var(--w-body2));border:1px solid var(--w-edge);border-radius:var(--w-r);box-shadow:var(--w-lift)}
.lcd{position:relative;background:var(--w-lcd);color:var(--w-lit);border-radius:10px;box-shadow:inset 0 0 0 1px #000,inset 0 3px 12px rgba(0,0,0,.9),0 1px 0 #fff;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.08) 0 22%,transparent 22.4%)}
.well{background:var(--w-body2);border-radius:10px;box-shadow:var(--w-sink)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9c9c6 60%,#9c9c99);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:4px;height:1px;background:#77777a;transform:rotate(-38deg)}
.screw.tl{left:10px;top:10px}.screw.tr{right:10px;top:10px}.screw.bl{left:10px;bottom:10px}.screw.br{right:10px;bottom:10px}
.knob{position:relative;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 38% 28%,#fff,#ecece9 55%,#d6d6d3);
  box-shadow:0 10px 16px -6px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 #fff;transition:transform .5s var(--w-out)}
.knob::after{content:"";position:absolute;left:50%;top:6px;width:2.5px;height:11px;margin-left:-1.25px;border-radius:2px;background:var(--w-ink)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--w-ink);box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.grille{background-image:radial-gradient(#1a1a1b 1.6px,transparent 2px);background-size:8px 8px}
.cap{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;background:var(--w-ink);color:var(--w-lit);border-radius:9px;padding:11px 18px;font:700 13px/1 var(--w-goth);
  box-shadow:0 5px 0 #000,0 14px 16px -8px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.cap:active{transform:translateY(4px);box-shadow:0 1px 0 #000,0 4px 6px -3px rgba(0,0,0,.5)}
.cap.w{background:linear-gradient(#fff,#f1f1ef);color:var(--w-ink);box-shadow:0 5px 0 #cfcfcc,0 14px 16px -8px rgba(0,0,0,.35),inset 0 0 0 1px var(--w-edge)}
.cap.w:active{box-shadow:0 1px 0 #cfcfcc,0 4px 6px -3px rgba(0,0,0,.35),inset 0 0 0 1px var(--w-edge)}
:focus-visible{outline:2px solid #888;outline-offset:3px}
/* 그림자가 잘리지 않도록 위젯 바깥에 남겨 두는 여백 */
.room{padding:2px 2px 34px}

html,body{height:100%;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.room{height:100%}
.dd{height:100%;display:flex;flex-direction:column;padding:12px 12px 14px}
/* 사진 창: 원본 색 그대로, 남는 높이를 사진이 채움 */
.win{position:relative;flex:1 1 auto;min-height:110px;border-radius:11px;overflow:hidden;background:#d9d8d4 center top/cover no-repeat;box-shadow:var(--w-sink)}
.win::after{content:"";position:absolute;inset:0;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)} /* 끌어가기 가볍게 막기 */
.cnt{flex:none;display:flex;align-items:center;gap:5px;margin:16px 4px 0}
.cnt b{font:800 22px/1 var(--w-mincho);margin-right:4px}
.cnt i{flex:1;font:800 46px/1.18 var(--w-mincho);font-style:normal;text-align:center;font-variant-numeric:tabular-nums;color:var(--w-lit);
  background:linear-gradient(#232325 0 49%,#000 49% 51%,#161617 51%);border-radius:7px;box-shadow:0 5px 8px -3px rgba(0,0,0,.5)}
.cnt.today i{background:linear-gradient(#f5f5f3 0 49%,#cfcfcc 49% 51%,#e9e9e6 51%);color:var(--w-ink);box-shadow:0 5px 8px -3px rgba(0,0,0,.3),inset 0 0 0 1px var(--w-edge)}
.next{flex:none;display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 8px;font-size:13px;color:var(--w-sub)}
.next b{font:800 17px/1 var(--w-mincho);color:var(--w-ink);font-variant-numeric:tabular-nums}
.bar{flex:none;display:grid;gap:1.5px;margin:0 4px;height:20px}
.bar i{background:#d2d2cf;border-radius:0 0 2px 2px}
.bar i.on{background:var(--w-ink)}
.bar i.now{background:var(--w-ink);animation:nowb 1.6s steps(1) infinite}
@keyframes nowb{50%{background:#8d8d92}}
.ped{flex:none;display:flex;align-items:center;gap:10px;margin:14px 4px 0}
.ped svg{flex:none;width:34px;height:30px}
.ped span{font:600 14px/1.35 var(--w-mincho)}
.ped span b{font-weight:800}
/* 키가 낮을 때 */
@media (max-height:420px){.cnt i{font-size:36px}.ped{display:none}}
</style>
</head>
<body>
<div class="room">
<article class="dev dd" aria-label="Fermata 디데이">
  <div class="win" id="ph" role="img"></div>
  <div class="cnt" id="cnt" aria-hidden="true"><b>D+</b><i id="d0">0</i><i id="d1">0</i><i id="d2">0</i><i id="d3">0</i></div>
  <p class="next" id="nextRow" style="margin-top:14px"><span id="nextL"></span><span id="nextR"></span></p>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="ped"><svg viewBox="0 0 38 34" aria-hidden="true"><path d="M2 6h34v5H2z" fill="#101011"/><path d="M14 11h10l3 17a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4z" fill="#101011"/></svg><span><b id="title">Fermata</b><br><span id="since"></span></span></div>
</article>
</div>

<script>
/* ───────── 여기만 고치면 됩니다 ───────── */
var CONFIG = {
  title: "Fermata",                 // 페달 옆 이름 글자
  since: "2026-11-03",              // 시작일 (년-월-일)
  step: 50,                         // 기념일 간격. 100으로 바꾸면 100일 단위
  firstDay: 1,                      // 1 = 시작한 날이 1일째 / 0 = 시작한 날이 0일째
  photo: "https://firebasestorage.googleapis.com/v0/b/lovelog-cc579.firebasestorage.app/o/u%2F1nvYwvg8xSeGVYAwaoh53uyDwz02%2Fmwdl6u36vpsou.jpg?alt=media&token=d6ae7fb4-e226-4f99-b22d-7925c5b39ded",
                                    // 사진 주소. 바꾸려면 따옴표 안 주소만 교체. 사진을 빼려면 "" 로
  photoPos: "50% 0%",               // 사진에서 보일 부분. "50% 0%"=위쪽, "50% 50%"=가운데, "50% 100%"=아래쪽
  photoAlt: "",                     // 사진 설명(화면 읽기 프로그램용). 비워 둬도 됨
  celebrate: true                   // true = 기념일 당일에 숫자판이 흰색으로 바뀌고 「今日が ○日目」. 끄려면 false
};
/* ─────────────────────────────────────── */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var D = 86400000;

  // 사진
  var ph = $('ph');
  if (CONFIG.photo) {
    ph.style.backgroundImage = 'url("' + CONFIG.photo + '")';
    ph.style.backgroundPosition = CONFIG.photoPos || '50% 0%';
  } else ph.style.display = 'none';
  if (CONFIG.photoAlt) ph.setAttribute('aria-label', CONFIG.photoAlt); else ph.setAttribute('aria-hidden', 'true');
  ['contextmenu','dragstart'].forEach(function(e){ document.addEventListener(e, function(ev){ ev.preventDefault(); }); });

  var m = String(CONFIG.since).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/) || [0, 2026, 11, 3];
  var S = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  var step = Math.max(1, +CONFIG.step || 50), off = +CONFIG.firstDay ? 1 : 0;

  // 눈금 칸 (기념일 간격만큼, 최대 100칸)
  var cells = Math.min(step, 100), bar = $('bar');
  bar.style.gridTemplateColumns = 'repeat(' + cells + ',1fr)';

  function calc(){
    var t = new Date(), today = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()); // 보는 사람 기기의 날짜 기준
    var n = Math.round((today - S) / D) + off;
    var isDay = n > 0 && n % step === 0 && CONFIG.celebrate;
    var next = n <= 0 ? step : (n % step === 0 ? n + step : Math.ceil(n / step) * step);
    var base = isDay ? n - step : next - step;      // 기념일 당일엔 방금 채운 칸을 보여 줌
    var shown = Math.max(n, 0);

    // 숫자판 (네 자리, 넘치면 늘어남)
    var digits = String(shown); while (digits.length < 4) digits = '0' + digits;
    var cnt = $('cnt');
    while (cnt.querySelectorAll('i').length < digits.length) { var x = document.createElement('i'); cnt.appendChild(x); }
    Array.prototype.forEach.call(cnt.querySelectorAll('i'), function(el, i){ el.textContent = digits[i] || ''; el.style.display = i < digits.length ? '' : 'none'; });
    cnt.classList.toggle('today', isDay);
    cnt.setAttribute('aria-label', 'D+' + shown);

    if (isDay) {
      $('nextL').innerHTML = '今日が <b>' + n + '</b>日目';
      $('nextR').innerHTML = '';
    } else {
      $('nextL').innerHTML = '<b>' + next + '</b>日目まで';
      $('nextR').innerHTML = 'あと <b>' + (next - shown) + '</b> 日';
    }

    // 눈금: 지난 날은 검정, 오늘은 깜빡임
    var done = isDay ? step : shown - base, h = '';
    for (var i = 1; i <= cells; i++) {
      var k = Math.round(i * step / cells);
      h += '<i' + (k < done ? ' class="on"' : (k === done && !isDay ? ' class="now"' : (isDay ? ' class="on"' : ''))) + '></i>';
    }
    bar.innerHTML = h;

    $('title').textContent = CONFIG.title || 'Fermata';
    $('since').textContent = (+m[1]) + '年' + (+m[2]) + '月' + (+m[3]) + '日から';
  }

  calc();
  // 자정이 지나면 숫자 갱신
  setInterval(calc, 60000);
})();
</script>
</body>
</html>
